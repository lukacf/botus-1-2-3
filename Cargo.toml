[package]
name = "botus-1-2-3"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "A compact spreadsheet workspace for agents. Recalculate like it is 1989."
repository = "https://github.com/lukacf/botus-1-2-3"

[features]
default = []
mobkit = ["dep:async-trait", "dep:meerkat-core", "dep:meerkat-mobkit", "dep:tokio", "serde_json/raw_value"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = { version = "0.1", optional = true }
meerkat-core = { version = "=0.8.51", optional = true }
meerkat-mobkit = { git = "https://github.com/lukacf/meerkat-mobkit", rev = "ed769e54c503c3a84e734b1e2700ee263d6f54d1", features = ["extension-state"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "native_host"
required-features = ["mobkit"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unreleased native APIs need these exact sources. Consuming hosts must copy
# this table into their root manifest because dependency patches do not propagate.
[patch.crates-io]
meerkat = { git = "https://github.com/lukacf/meerkat.git", rev = "d0f15ec36b74695fc3edbc4e75711f91d3535062" }
