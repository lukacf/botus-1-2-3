name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Locate isolated Cargo paths
        id: cargo_paths
        run: ./scripts/repo-cargo --print-env >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cargo_paths.outputs.CARGO_HOME }}/registry
            ${{ steps.cargo_paths.outputs.CARGO_HOME }}/git
            ${{ steps.cargo_paths.outputs.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-rust-1.97.0-core-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-rust-1.97.0-core-
      - run: make fmt
      - run: make check
      - run: make lint
      - run: make test
      - run: ./scripts/repo-cargo run --locked --example beige_budget
      - name: Default engine has no runtime dependency
        shell: bash
        run: |
          dependency_tree="$(./scripts/repo-cargo tree --locked --no-default-features --edges normal --prefix none)"
          if printf '%s\n' "$dependency_tree" | grep -E '^(meerkat|meta-extension-state|tokio)(-| )'; then
            echo "Default engine unexpectedly includes runtime dependencies"
            exit 1
          fi
  native:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Locate isolated Cargo paths
        id: cargo_paths
        run: ./scripts/repo-cargo --print-env >> "$GITHUB_OUTPUT"
      - name: Cache Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cargo_paths.outputs.CARGO_HOME }}/registry
            ${{ steps.cargo_paths.outputs.CARGO_HOME }}/git
          key: ${{ runner.os }}-rust-1.97.0-native-sources-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-1.97.0-native-sources-
      # Reuse downloads across pin changes, but keep compiled outputs tied to
      # exact dependency and profile inputs to avoid accumulating stale builds.
      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.cargo_paths.outputs.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-rust-1.97.0-native-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}
      - run: make check-meta
      - run: make lint-meta
      - run: make test-meta
      - run: ./scripts/repo-cargo run --locked --example native_host --features meta
      - run: make check-mcp
      - run: make lint-mcp
      - run: make test-installed-mcp
